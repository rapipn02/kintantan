# Nginx untuk Kintantan (situs statis) di VPS, dengan Cloudflare (proxy oranye) di depannya.
#
# Pasang:
#   sudo cp deploy/nginx/kintantan-headers.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/kintantan.conf /etc/nginx/sites-available/kintantan
#   sudo ln -s /etc/nginx/sites-available/kintantan /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ganti `kebun.example.com` dengan domainmu. Sertifikat = Cloudflare Origin Certificate
# (SSL/TLS -> Origin Server di dashboard Cloudflare), mode SSL "Full (strict)".

server {
    listen 80;
    listen [::]:80;
    server_name kebun.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kebun.example.com;

    ssl_certificate     /etc/ssl/cloudflare/kintantan.pem;
    ssl_certificate_key /etc/ssl/cloudflare/kintantan.key;

    # Folder rilis aktif (symlink, diganti otomatis oleh scripts/deploy-vps.sh).
    root /var/www/kintantan/current;
    index index.html;

    # Teks dikompres; gambar/suara/wasm sudah terkompres sendiri.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json
               image/svg+xml application/wasm;

    sendfile on;
    tcp_nopush on;
    etag on;

    # File ber-hash: isi berubah = nama berubah, jadi aman di-cache selamanya (browser & Cloudflare).
    location /assets/ {
        include snippets/kintantan-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/workbox-[\w-]+\.js$ {
        include snippets/kintantan-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Harus selalu dicek ulang supaya versi baru cepat sampai ke pengunjung.
    location ~ ^/(sw\.js|registerSW\.js)$ {
        include snippets/kintantan-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        include snippets/kintantan-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location /icons/ {
        include snippets/kintantan-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # File khusus Cloudflare Workers, tidak perlu disajikan.
    location = /_headers {
        return 404;
    }

    # index.html & deep link QR/NFC /s/<token> -> aplikasi (dicek ulang tiap kunjungan).
    location / {
        include snippets/kintantan-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
